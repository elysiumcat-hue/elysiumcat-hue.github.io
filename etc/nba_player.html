<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 30개 구단 핵심 선수 사전</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --pg-color: #f472b6; /* 핑크 */
      --sg-color: #fb923c; /* 오렌지 */
      --sf-color: #4ade80; /* 그린 */
      --pf-color: #a78bfa; /* 퍼플 */
      --c-color:  #60a5fa; /* 블루 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
    header p { color: var(--text-sub); }

    .controls {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    input, select {
      padding: 12px 16px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .stats {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s;
    }

    .player-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .player-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .team-name {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .pos-badge {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #334155;
    }

    .pos-PG { color: var(--pg-color); border: 1px solid var(--pg-color); }
    .pos-SG { color: var(--sg-color); border: 1px solid var(--sg-color); }
    .pos-SF { color: var(--sf-color); border: 1px solid var(--sf-color); }
    .pos-PF { color: var(--pf-color); border: 1px solid var(--pf-color); }
    .pos-C  { color: var(--c-color);  border: 1px solid var(--c-color); }

    .role-title {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.9rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏀 NBA 핵심 선수 가이드</h1>
    <p>각 팀을 대표하는 주전 및 주요 식스맨의 정보와 특징을 검색해보세요.</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="선수 이름 또는 특징 검색 (예: 3점슛, 돈치치)...">
    <select id="teamSelect">
      <option value="all">모든 구단 보기</option>
      <!-- 구단 옵션은 JS로 자동 생성됨 -->
    </select>
    <select id="posSelect">
      <option value="all">모든 포지션</option>
      <option value="PG">PG (포인트 가드)</option>
      <option value="SG">SG (슈팅 가드)</option>
      <option value="SF">SF (스몰 포워드)</option>
      <option value="PF">PF (파워 포워드)</option>
      <option value="C">C (센터)</option>
    </select>
  </div>

  <div class="stats" id="statsCount">표시된 선수: 0명</div>
  
  <div class="player-grid" id="playerGrid">
    <!-- 선수 카드가 표시되는 영역 -->
  </div>
</div>

// 구단 목록 자동 생성
const teams = [...new Set(playersData.map(p => p.team))].sort();
const teamSelect = document.getElementById("teamSelect");
teams.forEach(team => {
  const option = document.createElement("option");
  option.value = team;
  option.textContent = team;
  teamSelect.appendChild(option);
});

// 검색 및 필터 기능
const searchInput = document.getElementById("searchInput");
const posSelect = document.getElementById("posSelect");
const playerGrid = document.getElementById("playerGrid");
const statsCount = document.getElementById("statsCount");

function renderPlayers() {
  const searchTerm = searchInput.value.toLowerCase();
  const selectedTeam = teamSelect.value;
  const selectedPos = posSelect.value;

  const filtered = playersData.filter(p => {
    const matchSearch = p.name.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm) || p.role.toLowerCase().includes(searchTerm);
    const matchTeam = selectedTeam === "all" || p.team === selectedTeam;
    const matchPos = selectedPos === "all" || p.pos === selectedPos || p.pos.includes(selectedPos);
    return matchSearch && matchTeam && matchPos;
  });

  statsCount.textContent = `표시된 핵심 선수: ${filtered.length}명`;

  if (filtered.length === 0) {
    playerGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">검색 결과가 없습니다.</div>`;
    return;
  }

  playerGrid.innerHTML = filtered.map(p => `
    <div class="player-card">
      <div class="card-header">
        <div>
          <div class="player-name">${p.name}</div>
          <div class="team-name">${p.team}</div>
        </div>
        <span class="pos-badge pos-${p.pos}">${p.pos}</span>
      </div>
      <div class="role-title">⚡ ${p.role}</div>
      <div class="desc">${p.desc}</div>
    </div>
  `).join("");
}

// 이벤트 리스너 등록
searchInput.addEventListener("input", renderPlayers);
teamSelect.addEventListener("change", renderPlayers);
posSelect.addEventListener("change", renderPlayers);

// 초기 렌더링
renderPlayers();
