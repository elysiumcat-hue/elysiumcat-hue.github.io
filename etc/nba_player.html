<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 30개 구단 핵심 선수 사전</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --pg-color: #f472b6;
      --sg-color: #fb923c;
      --sf-color: #4ade80;
      --pf-color: #a78bfa;
      --c-color:  #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
    header p { color: var(--text-sub); }

    .controls {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    input, select {
      padding: 12px 16px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      flex: 1;
      min-width: 250px;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .stats {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 600;
      text-align: right;
    }

    /* 팀별 그룹화 스타일 */
    .team-section {
      margin-bottom: 40px;
      background: #151e2e;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .team-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: transform 0.2s;
    }

    .player-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .player-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }

    .pos-badge {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #334155;
    }

    .pos-PG { color: var(--pg-color); border: 1px solid var(--pg-color); }
    .pos-SG { color: var(--sg-color); border: 1px solid var(--sg-color); }
    .pos-SF { color: var(--sf-color); border: 1px solid var(--sf-color); }
    .pos-PF { color: var(--pf-color); border: 1px solid var(--pf-color); }
    .pos-C  { color: var(--c-color);  border: 1px solid var(--c-color); }

    .role-title {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      word-break: keep-all;
    }
    
    .no-result {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏀 NBA 핵심 선수 가이드 (팀별 보기)</h1>
    <p>각 팀을 대표하는 주전 선수들을 한눈에 확인하고 검색해 보세요.</p>
  </header>

  <div class="controls">

    <select id="posSelect">

      <option value="SG">SG (슈팅 가드 - 외곽 득점)</option>
      <option value="SF">SF (스몰 포워드 - 공수겸장)</option>
      <option value="PF">PF (파워 포워드 - 궂은일/득점)</option>
      <option value="C">C (센터 - 골밑 수호자)</option>
    </select>
  </div>

  <div class="stats" id="statsCount">표시된 선수: 0명</div>

    <!-- 자바스크립트를 통해 팀별 그룹이 여기에 렌더링됩니다 -->
  </div>
</div>

// 팀명 추출 (중복 제거)
const teams = [...new Set(playersData.map(p => p.team))];

// HTML 요소 가져오기
const searchInput = document.getElementById("searchInput");
const posSelect = document.getElementById("posSelect");
const mainContainer = document.getElementById("mainContainer");
const statsCount = document.getElementById("statsCount");

// 렌더링 함수
function renderPlayers() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  const selectedPos = posSelect.value;
  
  mainContainer.innerHTML = ""; // 기존 화면 초기화
  let totalDisplayedPlayers = 0;

  // 각 팀별로 반복하면서 그리기
  teams.forEach(team => {
    // 해당 팀의 선수 중 검색/필터 조건에 맞는 선수만 추려내기
    const teamPlayers = playersData.filter(p => {
      const isTeamMatch = p.team === team;
      const isSearchMatch = p.name.toLowerCase().includes(searchTerm) || 
                            p.desc.toLowerCase().includes(searchTerm) || 
                            p.role.toLowerCase().includes(searchTerm);
      const isPosMatch = selectedPos === "all" || p.pos === selectedPos || p.pos.includes(selectedPos);
      
      return isTeamMatch && isSearchMatch && isPosMatch;
    });

    // 조건에 맞는 선수가 1명이라도 있으면 해당 팀 섹션을 화면에 그림
    if (teamPlayers.length > 0) {
      totalDisplayedPlayers += teamPlayers.length;
      
      const teamSection = document.createElement("div");
      teamSection.className = "team-section";
      
      // 팀 타이틀과 선수 그리드를 HTML 문자열로 생성
      teamSection.innerHTML = `
        <h2 class="team-title">🛡️ ${team}</h2>
        <div class="player-grid">
          ${teamPlayers.map(p => `
            <div class="player-card">
              <div class="card-header">
                <div class="player-name">${p.name}</div>
                <span class="pos-badge pos-${p.pos}">${p.pos}</span>
              </div>
              <div class="role-title">⚡ ${p.role}</div>
              <div class="desc">${p.desc}</div>
            </div>
          `).join("")}
        </div>
      `;
      
      mainContainer.appendChild(teamSection);
    }
  });

  statsCount.textContent = `표시된 선수: ${totalDisplayedPlayers}명`;

  // 검색 결과가 아예 없을 경우 메시지 표시
  if (totalDisplayedPlayers === 0) {
    mainContainer.innerHTML = `<div class="no-result">검색 조건에 맞는 선수가 없습니다. 다른 검색어를 입력해 보세요.</div>`;
  }
}

// 이벤트 리스너: 글자를 치거나 포지션을 변경할 때마다 화면 즉시 업데이트
searchInput.addEventListener("input", renderPlayers);
posSelect.addEventListener("change", renderPlayers);

// 페이지 접속 시 초기 화면 그리기
renderPlayers();
</script>
