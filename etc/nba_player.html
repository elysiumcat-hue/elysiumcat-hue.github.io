<html lang="ko">
<head>

  <title>NBA 30개 구단 완벽 로스터 (주전 & 식스맨)</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #161f30;
      --card-hover: #1e2b42;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --sixth-accent: #f59e0b; /* 식스맨 강조 컬러 */
      --pg-color: #f472b6;
      --sg-color: #fb923c;
      --sf-color: #4ade80;
      --pf-color: #a78bfa;
      --c-color:  #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1300px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
    header p { color: var(--text-sub); }

    .controls {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    input, select {
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .team-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .team-card:hover {
      transform: translateY(-5px);
      border-color: #64748b;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .card-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .team-name { font-size: 1.25rem; font-weight: 800; }
    .conf-badge {
      font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 6px;
    }
    .conf-east { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .conf-west { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 주전 라인업 스타일 */
    .starters-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .starter-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 500;
    }
    .pos-badge {
      width: 36px;
      text-align: center;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 3px 0;
      border-radius: 4px;
      background: #1e293b;
    }
    .pos-PG { color: var(--pg-color); border: 1px solid var(--pg-color); }
    .pos-SG { color: var(--sg-color); border: 1px solid var(--sg-color); }
    .pos-SF { color: var(--sf-color); border: 1px solid var(--sf-color); }
    .pos-PF { color: var(--pf-color); border: 1px solid var(--pf-color); }
    .pos-C  { color: var(--c-color);  border: 1px solid var(--c-color); }

    .divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* 식스맨 스타일 */
    .sixth-man-box {
      background: rgba(245, 158, 11, 0.05);
      border-left: 4px solid var(--sixth-accent);
      padding: 12px;
      border-radius: 0 8px 8px 0;
    }
    .sixth-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sixth-tag {
      font-size: 0.75rem;
      background: rgba(245, 158, 11, 0.2);
      color: var(--sixth-accent);
      padding: 2px 8px;
      border-radius: 12px;
    }
    .sixth-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      word-break: keep-all;
    }
    
    .stats { text-align: right; color: var(--accent); font-weight: 600; margin-bottom: 15px; }

  </style>
</head>

const mainContainer = document.getElementById("mainContainer");
const searchInput = document.getElementById("searchInput");
const confSelect = document.getElementById("confSelect");
const statsCount = document.getElementById("statsCount");

function renderCards() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  const selectedConf = confSelect.value;
  
  mainContainer.innerHTML = "";
  
  const filteredData = rosterData.filter(t => {
    // 팀명, 주전 선수 이름, 식스맨 이름에서 모두 검색 가능
    const matchTeam = t.team.toLowerCase().includes(searchTerm);
    const matchStarters = t.starters.some(s => s.name.toLowerCase().includes(searchTerm));
    const matchSixth = t.sixthMan.toLowerCase().includes(searchTerm);
    
    const isSearchMatch = matchTeam || matchStarters || matchSixth;
    const isConfMatch = selectedConf === "all" || t.conf === selectedConf;
    
    return isSearchMatch && isConfMatch;
  });
  
  statsCount.textContent = `표시된 구단: ${filteredData.length}개`;
  
  if (filteredData.length === 0) {
    mainContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:50px; color:#94a3b8;">검색 결과가 없습니다.</div>`;
    return;
  }
  
  filteredData.forEach(t => {
    const card = document.createElement("div");
    card.className = "team-card";
    
    const confName = t.conf === "east" ? "동부" : "서부";
    
    // 주전 라인업 HTML 생성
    const startersHTML = t.starters.map(s => `
      <div class="starter-item">
        <span class="pos-badge pos-${s.pos}">${s.pos}</span>
        <span>${s.name}</span>
      </div>
    `).join("");
    
    card.innerHTML = `
      <div class="card-header">
        <div class="team-name">${t.team}</div>
        <span class="conf-badge conf-${t.conf}">${confName}</span>
      </div>
      
      <div class="card-body">
        <div>
          <div class="section-title">🌟 주전 라인업 (Starting 5)</div>
          <div class="starters-list">
            ${startersHTML}
          </div>
        </div>
        
        <div class="divider"></div>
        
        <div>
          <div class="section-title">🔥 핵심 식스맨 (Sixth Man)</div>
          <div class="sixth-man-box">
            <div class="sixth-name">
              ${t.sixthMan} 
              <span class="sixth-tag">${t.sixthTag}</span>
            </div>
            <div class="sixth-desc">${t.sixthDesc}</div>
          </div>
        </div>
      </div>
    `;
    mainContainer.appendChild(card);
  });
}

searchInput.addEventListener("input", renderCards);
confSelect.addEventListener("change", renderCards);

// 초기 렌더링
renderCards();
</script>
