<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #161f30;
      --bg-card-hover: #1e2b42;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --east-color: #3b82f6;
      --west-color: #ef4444;
      --accent: #f59e0b;
      --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* 컨트롤 영역 */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-box {
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: #1e293b;
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f19;
      font-weight: 700;
    }

    .stats-summary {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* 그리드 레이아웃 */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    /* 팀 카드 */
    .team-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }

    .team-card:hover {
      transform: translateY(-3px);
      border-color: #64748b;
      background: var(--bg-card-hover);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .team-titles h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .team-titles .en-name {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .conf-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .conf-badge.east {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .conf-badge.west {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .tier-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .info-section {
      font-size: 0.9rem;
    }

    .info-title {
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .player-tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .player-tag {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #38bdf8;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .watch-point {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      border-radius: 0 6px 6px 0;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* 반응형 */
    @media (max-width: 640px) {
      .team-grid {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

const teamGrid = document.getElementById("teamGrid");
const searchInput = document.getElementById("searchInput");
const filterButtons = document.querySelectorAll(".filter-btn");
const statsSummary = document.getElementById("statsSummary");

let currentFilter = "all";
let currentSearch = "";

function renderTeams() {
  const filtered = teams.filter(team => {
    // 텍스트 검색 조건 (팀명, 영문명, 도시, 선수)
    const q = currentSearch.toLowerCase();
    const matchSearch = 
      team.nameKr.toLowerCase().includes(q) ||
      team.nameEn.toLowerCase().includes(q) ||
      team.city.toLowerCase().includes(q) ||
      team.players.some(p => p.toLowerCase().includes(q));

    if (!matchSearch) return false;

    // 카테고리 필터 조건
    if (currentFilter === "all") return true;
    if (currentFilter === "east" || currentFilter === "west") return team.conf === currentFilter;
    if (currentFilter === "contender") return team.tier === "contender";
    if (currentFilter === "playoff") return team.tier === "playoff";
    if (currentFilter === "rising") return team.tier === "rising";

    return true;
  });

  statsSummary.textContent = `표시 중인 구단: ${filtered.length}개`;

  if (filtered.length === 0) {
    teamGrid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--text-muted);">
        <p style="font-size: 1.2rem;">검색 결과가 없습니다.</p>
        <p style="font-size: 0.9rem; margin-top: 4px;">다른 팀명이나 선수 이름으로 검색해 보세요.</p>
      </div>
    `;
    return;
  }

  teamGrid.innerHTML = filtered.map(t => `
    <article class="team-card">
      <div class="card-header">
        <div class="team-titles">
          <h2>${t.nameKr}</h2>
          <div class="en-name">${t.nameEn}</div>
        </div>
        <div class="badge-wrap">
          <span class="conf-badge ${t.conf}">${t.conf === "east" ? "동부" : "서부"}</span>
          <span class="tier-badge">${t.tierName}</span>
        </div>
      </div>

      <div class="meta-row">
        <span>📍 ${t.city}</span>
        <span>🏷️️ ${t.div}</span>
      </div>

      <div class="info-section">
        <div class="info-title">⭐ 핵심 간판 스타</div>
        <div class="player-tag-wrap">
          ${t.players.map(p => `<span class="player-tag">${p}</span>`).join("")}
        </div>
      </div>

      <div class="info-section">
        <div class="info-title">⚡ 팀 컬러 및 전술</div>
        <p style="color: #cbd5e1; font-size: 0.85rem;">${t.style}</p>
      </div>

      <div class="watch-point">
        <strong>👀 입문자 관전 포인트:</strong> ${t.point}
      </div>
    </article>
  `).join("");
}

// 필터 버튼 이벤트
filterButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    filterButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderTeams();
  });
});

// 검색 이벤트
searchInput.addEventListener("input", (e) => {
  currentSearch = e.target.value.trim();
  renderTeams();
});

// 초기 렌더링
renderTeams();
</script>
