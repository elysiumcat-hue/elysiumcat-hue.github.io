<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나트랑 맛집 & 카페 가이드</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --tag-bg: #E0E7FF;
            --tag-text: #3730A3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            word-break: keep-all;
        }

        .category-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .badge-restaurant {
            background-color: #FEF3C7;
            color: #D97706;
        }

        .badge-cafe {
            background-color: #D1FAE5;
            color: #059669;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 600;
            color: #F59E0B;
        }

        .card-body {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .menu-tag {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .features {
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        
        .highlight {
            background-color: #FEF08A;
            padding: 0 4px;
            border-radius: 4px;
        }

        .card-footer {
            padding: 1.5rem;
            background-color: #F9FAFB;
            border-top: 1px solid #E5E7EB;
        }

        .map-btn {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .map-btn:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>

            <button class="filter-btn" data-filter="cafe">카페</button>
        </div>

        <div class="grid" id="cardGrid">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </div>

                link: 'https://maps.app.goo.gl/NQUJfuuu5vzkF7t16?g_st=akt'
            },
            {
                type: 'restaurant',
                title: 'K.HOUSE Restaurant',
                location: '나트랑 시내, 한식당',
                rating: '4.9',
                menu: ['랍스터 치즈구이', '소고기 스테이크', '칠리크랩', '떡볶이', '김치볶음밥'],
                features: '쩐푸 해변 길에 위치해 탁 트인 오션뷰. 퓨전 한식당 겸 해산물 레스토랑. 새벽 2시까지 운영하여 야식 즐기기 좋음.',

            },
            {
                type: 'restaurant',
                title: '나트랑 돌산 DA NUI',

            // Cafe

            },
            {

                location: '나트랑 시내',

        function renderCards(filterType) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = ''; // Clear existing cards

            const filteredData = data.filter(item => filterType === 'all' || item.type === filterType);

            filteredData.forEach(item => {
                const isRestaurant = item.type === 'restaurant';
                const badgeClass = isRestaurant ? 'badge-restaurant' : 'badge-cafe';
                const badgeText = isRestaurant ? '식당' : '카페';

                const menuHtml = item.menu.map(m => `<span class="menu-tag">${m}</span>`).join('');
                
                const cardHtml = `
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h3 class="card-title">${item.title}</h3>
                                <div style="font-size: 0.85rem; color: #6B7280; margin-bottom: 0.5rem;">${item.location}</div>
                                <span class="category-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="rating">
                                <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                                </svg>
                                ${item.rating}
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="section-title">추천 메뉴</div>
                            <div class="menu-tags">
                                ${menuHtml}
                            </div>
                            <div class="section-title">특징</div>
                            <div class="features">${item.features}</div>
                        </div>
                        <div class="card-footer">
                            <a href="${item.link}" target="_blank" class="map-btn">
                                구글 맵에서 보기
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Initialize with 'all'
        renderCards('all');

        // Filter button click logic
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                // Add active class to clicked
                e.target.classList.add('active');
                
                const filter = e.target.getAttribute('data-filter');
                renderCards(filter);
            });
        });
    </script>
</body>
</html>
